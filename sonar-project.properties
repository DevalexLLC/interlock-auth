sonar.projectKey=Devalex:interlock-auth
sonar.projectName=interlock-auth

# Sources and tests must be disjoint sets. Everything under the repo is a source by default; the
# patterns below carve the test files back out and hand them to `sonar.tests`, so test code is
# analyzed as test code instead of being reported as production code that nothing covers.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=src/**/__tests__/**,**/*.test.ts,**/*.test.tsx

# Test files appear here *and* in `sonar.test.inclusions` on purpose: the inclusion assigns them to
# the test set, this exclusion removes them from the source set. Both are required. Every
# `__tests__` directory counts, at any depth: `src/core/__tests__/helpers` holds the specs' fakes.
#
# `dist` and `coverage` are build artifacts that exist in the workspace by the time the scan runs,
# because the scan follows the build and the coverage run.
sonar.exclusions=src/**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/dist/**,**/coverage/**,**/node_modules/**

# Analyzed for issues, but not expected to carry coverage. The barrel files re-export and nothing
# else; the exclusion matches `coverage.exclude` in `vitest.config.ts`, so both tools measure the
# same set.
sonar.coverage.exclusions=**/*.config.ts,**/*.d.ts,src/index.ts,src/next/index.ts,src/react/index.ts

# Also passed on the command line by the workflow; declared here so a local or ad-hoc scan measures
# the same thing CI does.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
